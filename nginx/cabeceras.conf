# Cabeceras de seguridad. Se incluye en cada location: en nginx, un add_header dentro de un
# location anula los del server, así que no basta con ponerlas una vez arriba.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# La cámara, solo para la propia app (el escáner); lo demás, para nadie
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
